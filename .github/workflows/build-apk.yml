name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Loop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web App
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Download
        run: |
          mkdir -p dist-apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Loop.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Android-APK
          path: dist-apk/Loop.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Loop Messenger v1.0.0 (Android APK)"
          body: |
            ### 📱 Loop Messenger for Android
            
            - **App Name**: Loop
            - **Package**: `com.loop.app`
            - **Version**: 1.0.0
            - **Backend**: https://loop-messenge.onrender.com
            
            Download `Loop.apk` below and install directly on any Android phone!
          files: dist-apk/Loop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
